# Production stack for a single server (e.g. a DigitalOcean droplet).
# Configure via .env (see .env.example), then:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unifiedos
      POSTGRES_DB: unifiedos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifiedos -d unifiedos"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: unifiedos:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://unifiedos:${POSTGRES_PASSWORD}@db:5432/unifiedos
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Your domain (HTTPS certificates are issued automatically), or ":80" for plain HTTP by IP.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
